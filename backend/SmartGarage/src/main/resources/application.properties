spring.application.name=Smart Garage

spring.datasource.url=jdbc:mariadb://localhost:3306/smart_garage
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

server.servlet.session.timeout=30m

# --- Default admin account configuration ---
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}
app.admin.name=${ADMIN_NAME}
app.admin.address=${ADMIN_ADDRESS}
app.admin.phone=${ADMIN_PHONE}

logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.springframework.security=DEBUG

debug=false